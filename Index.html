<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bruda Web</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#0f172a;
      color:white;
      overflow-x:hidden;
    }

    header{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      text-align:center;
      background:linear-gradient(135deg,#0f172a,#1e293b);
    }

    h1{
      font-size:70px;
      margin-bottom:15px;
      animation:fade 1s ease;
    }

    p{
      font-size:20px;
      color:#cbd5e1;
      margin-bottom:25px;
    }

    button{
      padding:15px 35px;
      border:none;
      border-radius:12px;
      background:#3b82f6;
      color:white;
      font-size:18px;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      transform:scale(1.08);
      background:#2563eb;
    }

    .cards{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:25px;
      padding:80px 10%;
    }

    .card{
      background:#1e293b;
      padding:30px;
      border-radius:20px;
      transition:0.3s;
      box-shadow:0 0 20px rgba(0,0,0,0.3);
    }

    .card:hover{
      transform:translateY(-10px);
    }

    .card h2{
      margin-bottom:10px;
      color:#60a5fa;
    }

    footer{
      text-align:center;
      padding:30px;
      background:#020617;
      color:#94a3b8;
    }

    @keyframes fade{
      from{
        opacity:0;
        transform:translateY(40px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .popup{
      position:fixed;
      top:20px;
      right:-400px;
      background:#22c55e;
      padding:20px;
      border-radius:12px;
      transition:0.5s;
      font-weight:bold;
    }

    .show{
      right:20px;
    }
  </style>
</head>

<body>

  <div class="popup" id="popup">
    Dobrodošao Bruda 😎
  </div>

  <header>
    <h1>Moja Brutalna Stranica</h1>
    <p>HTML • CSS • JavaScript</p>

    <button onclick="showMessage()">
      Klikni me
    </button>
  </header>

  <section class="cards">

    <div class="card">
      <h2>Brz Design</h2>
      <p>Moderna stranica sa animacijama i efektima.</p>
    </div>

    <div class="card">
      <h2>JavaScript</h2>
      <p>Dugme pokreće popup i interakciju.</p>
    </div>

    <div class="card">
      <h2>Responsive</h2>
      <p>Radi i na telefonu i na računaru.</p>
    </div>

  </section>

  <footer>
    Napravio Halid 💙
  </footer>

  <script>
    function showMessage(){
      let popup = document.getElementById("popup");

      popup.classList.add("show");

      setTimeout(() => {
        popup.classList.remove("show");
      }, 3000);
    }
  </script>

</body>
</html>
