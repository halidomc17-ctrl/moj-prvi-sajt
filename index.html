<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Dining Experience | Digital Menu Demo</title>
    <style>
        :root { --main: #1a1a1a; --gold: #c5a059; --white: #ffffff; }
        body { font-family: 'Inter', sans-serif; background: var(--main); color: var(--white); margin: 0; text-align: center; }
        .hero { padding: 80px 20px; border-bottom: 1px solid var(--gold); background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?auto=format&fit=crop&w=800&q=80'); background-size: cover; }
        h1 { font-size: 3rem; margin: 0; color: var(--gold); letter-spacing: -1px; }
        .menu { padding: 40px 20px; max-width: 600px; margin: auto; }
        .item { display: flex; justify-content: space-between; margin-bottom: 25px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .item b { font-size: 1.2rem; display: block; text-align: left; }
        .price { color: var(--gold); font-size: 1.2rem; font-weight: bold; }
        .btn { display: block; background: var(--gold); color: black; padding: 20px; margin: 30px; text-decoration: none; font-weight: bold; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="hero">
        <h1>PREMIUM DINING</h1>
        <p>Mobile-First Digital Experience</p>
    </div>
    <div class="menu">
        <div class="item">
            <div><b>Signature Steak</b><small>Organic beef, truffle butter, asparagus</small></div>
            <div class="price">$32</div>
        </div>
        <div class="item">
            <div><b>Fresh Seafood Pasta</b><small>Handmade linguine, cherry tomatoes, basil</small></div>
            <div class="price">$24</div>
        </div>
        <a href="#" class="btn">BOOK A TABLE NOW</a>
    </div>
</body>
</html>
