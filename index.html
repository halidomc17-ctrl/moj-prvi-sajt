<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barolo Jelah | Premium Experience</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --dark: #0c0c0c; --light: #f4f4f4; --gray: #1a1a1a; }
        body { font-family: 'Poppins', sans-serif; margin: 0; background-color: var(--dark); color: var(--light); scroll-behavior: smooth; }
        
        .hero {
            height: 80vh;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('barolo-1.jpg');
            background-size: cover; background-position: center;
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
            border-bottom: 3px solid var(--gold);
        }

        .hero h1 { font-family: 'Playfair Display', serif; font-size: 3.5rem; margin: 0; color: var(--gold); text-transform: uppercase; }
        .section-title { font-family: 'Playfair Display', serif; font-size: 2.5rem; color: var(--gold); margin: 50px 0; text-align: center; }
        
        .container { max-width: 1000px; margin: auto; padding: 20px; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; padding: 20px; }
        .gallery img { width: 100%; height: 300px; object-fit: cover; border-radius: 8px; border: 1px solid var(--gold); }

        footer { background: #000; padding: 60px 20px; text-align: center; border-top: 1px solid var(--gray); }
        .btn-booking { background: var(--gold); color: black; padding: 18px 40px; text-decoration: none; font-weight: bold; border-radius: 50px; display: inline-block; transition: 0.3s; }
        .btn-booking:hover { background: white; box-shadow: 0 0 20px var(--gold); }
    </style>
</head>
<body>

    <div class="hero">
        <h1>BAROLO JELAH</h1>
        <p style="letter-spacing: 3px;">RESTORAN & BAR</p>
        <a href="#gallery" class="btn-booking">POGLEDAJTE AMBIJENT</a>
    </div>

    <div class="container" id="gallery">
        <h2 class="section-title">Vrhunski Ambijent</h2>
        <div class="gallery">
            <img src="barolo-2.jpg" alt="Barolo Enterijer 1">
            <img src="barolo-3.jpg" alt="Barolo Enterijer 2">
            <img src="barolo-1.jpg" alt="Barolo Enterijer 3">
        </div>
    </div>

    <footer>
        <div style="margin-bottom: 30px;">
            <h4>LOKACIJA</h4>
            <p>Jelah Polje, 74264 Jelah</p>
            <h4>REZERVACIJE</h4>
            <p>+387 61 000 000</p> <!-- Ovdje možeš staviti njihov pravi broj sa Instagrama -->
        </div>
        <a href="tel:+38761000000" class="btn-booking">NAZOVITE ZA REZERVACIJU</a>
        <p style="margin-top: 50px; font-size: 0.8rem; color: #555;">&copy; 2026 Developed by Halid</p>
    </footer>

</body>
</html>
