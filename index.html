<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restoran Bruda | Najbolji roštilj u gradu</title>
    <meta name="description" content="Pogledajte naš digitalni meni. Vrhunska pizza, roštilj i domaća jela. Posjetite nas ili naručite odmah!">
    
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: white;
            text-align: center;
        }
        .header {
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1514327605112-b887c0e61c0a?auto=format&fit=crop&w=500&q=80');
            background-size: cover;
            padding: 50px 20px;
        }
        h1 { margin: 0; font-size: 2.5rem; color: #ffcc00; }
        .menu-section { padding: 20px; }
        .item {
            background: #2a2a2a;
            margin: 10px auto;
            padding: 15px;
            border-radius: 10px;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 5px solid #ffcc00;
        }
        .item-info { text-align: left; }
        .price { font-weight: bold; color: #ffcc00; font-size: 1.2rem; }
        
        /* Dugme koje zamjenjuje tvoje staro "Klikni me" */
        .call-btn {
            display: inline-block;
            background-color: #ffcc00;
            color: black;
            padding: 15px 30px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 50px;
            margin-top: 20px;
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(255, 204, 0, 0.4);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>RESTORAN BRUDA</h1>
        <p>Tradicionalna kuhinja & moderan ambijent</p>
    </div>

    <div class="menu-section">
        <h2>Danas izdvajamo:</h2>
        
        <div class="item">
            <div class="item-info">
                <strong>Teleći Ćevapi</strong>
                <div style="font-size: 0.8rem; color: #aaa;">10 komada, somun, luk</div>
            </div>
            <div class="price">12 KM</div>
        </div>

        <div class="item">
            <div class="item-info">
                <strong>Pizza Capricciosa</strong>
                <div style="font-size: 0.8rem; color: #aaa;">Šunka, sir, gljive, pelat</div>
            </div>
            <div class="price">10 KM</div>
        </div>

        <div class="item">
            <div class="item-info">
                <strong>Domaća Limunada</strong>
                <div style="font-size: 0.8rem; color: #aaa;">Svježe cijeđena, 0.3l</div>
            </div>
            <div class="price">4 KM</div>
        </div>

        <a href="tel:+38761123456" class="call-btn">Rezerviši stol odmah</a>
    </div>

    <footer style="padding: 20px; font-size: 0.8rem; color: #666;">
        &copy; 2026 Restoran Bruda. Powered by halidomc17-ctrl
    </footer>

</body>
</html>
